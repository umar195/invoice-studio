name: Build and Verify APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies (locked)
        run: npm ci

      - name: Dependency audit (runtime)
        run: npm audit --omit=dev --audit-level=high

      - name: Create Android project
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Verify bundled asset provenance
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p /tmp/apk-unpacked
          unzip -q "$APK" assets/native-bridge.js assets/public/sw.js -d /tmp/apk-unpacked
          cmp -s /tmp/apk-unpacked/assets/native-bridge.js node_modules/@capacitor/android/capacitor/src/main/assets/native-bridge.js
          cmp -s /tmp/apk-unpacked/assets/public/sw.js www/sw.js

      - name: Create hash and candidate zip
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/app-debug.apk
          sha256sum dist/app-debug.apk | tee dist/app-debug.apk.sha256
          (cd dist && zip -q invoice-studio-apk.zip app-debug.apk app-debug.apk.sha256)

      - name: Upload scan candidate
        uses: actions/upload-artifact@v4
        with:
          name: invoice-studio-apk-candidate
          path: dist/
          if-no-files-found: error

  windows-defender-scan:
    needs: build-apk
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Download scan candidate
        uses: actions/download-artifact@v4
        with:
          name: invoice-studio-apk-candidate
          path: candidate

      - name: Scan APK with Microsoft Defender
        id: defender
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $status = "clean"
          $reportDir = Join-Path $env:RUNNER_TEMP "defender-report"
          New-Item -ItemType Directory -Path $reportDir -Force | Out-Null
          $report = Join-Path $reportDir "defender-scan-report.txt"
          "Windows Defender scan report (invoice-studio)" | Set-Content $report
          "UTC: $(Get-Date -Format o)" | Add-Content $report
          "" | Add-Content $report

          $apkPath = (Resolve-Path "candidate/app-debug.apk").Path
          $zipPath = (Resolve-Path "candidate/invoice-studio-apk.zip").Path
          $shaPath = (Resolve-Path "candidate/app-debug.apk.sha256").Path
          $expandedRoot = Join-Path $env:RUNNER_TEMP "apk-expanded"
          if (Test-Path $expandedRoot) { Remove-Item $expandedRoot -Recurse -Force }
          New-Item -ItemType Directory -Path $expandedRoot | Out-Null
          Copy-Item $apkPath (Join-Path $expandedRoot "app-debug.zip")
          Expand-Archive -Path (Join-Path $expandedRoot "app-debug.zip") -DestinationPath (Join-Path $expandedRoot "app-debug") -Force
          $assetsPath = Join-Path $expandedRoot "app-debug/assets"

          $sigLine = (Get-Content $shaPath | Select-Object -First 1)
          "APK SHA256: $sigLine" | Add-Content $report

          $candidatePaths = @(
            (Join-Path $env:ProgramFiles "Windows Defender\MpCmdRun.exe")
          )
          $platformPaths = Get-ChildItem -Path (Join-Path $env:ProgramData "Microsoft\Windows Defender\Platform") -Filter "MpCmdRun.exe" -Recurse -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          if ($platformPaths) { $candidatePaths += $platformPaths }
          $mpCmd = $candidatePaths | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $mpCmd) {
            $status = "unavailable"
            "Scanner status: Microsoft Defender CLI unavailable on this runner." | Add-Content $report
          } else {
            "Scanner: $mpCmd" | Add-Content $report
            try {
              & $mpCmd -SignatureUpdate | Tee-Object -FilePath $report -Append | Out-Null
            } catch {
              if ($status -eq "clean") { $status = "scan_error" }
              "Signature update failed: $($_.Exception.Message)" | Add-Content $report
            }

            $candidateDir = (Resolve-Path "candidate").Path
            $targets = @(
              @{Name="candidate_dir_including_apk_and_zip"; Path=$candidateDir},
              @{Name="assets"; Path=$assetsPath}
            )
            foreach ($target in $targets) {
              "" | Add-Content $report
              "Scanning $($target.Name): $($target.Path)" | Add-Content $report
              $scanOutput = & $mpCmd -Scan -ScanType 3 -File $target.Path 2>&1
              $scanText = ($scanOutput | Out-String)
              $scanText | Tee-Object -FilePath $report -Append | Out-Null
              $exitCode = $LASTEXITCODE
              "ExitCode: $exitCode" | Add-Content $report
              if ($exitCode -ne 0 -and $status -eq "clean") {
                $status = "detected"
              }
              if ($scanText -match "was skipped" -and $status -eq "clean") {
                $status = "scan_incomplete"
              }
            }
          }

          $safeReport = Join-Path $reportDir "defender-scan-report-sanitized.txt"
          $sanitized = (Get-Content $report -Raw)
          $sanitized = $sanitized -replace [Regex]::Escape($env:RUNNER_TEMP), "[runner-temp]"
          $sanitized = $sanitized -replace [Regex]::Escape($env:USERPROFILE), "[user-profile]"
          Set-Content -Path $safeReport -Value $sanitized

          "scan_status=$status" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "report_dir=$reportDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invoice-studio-scan-evidence
          path: ${{ steps.defender.outputs.report_dir }}
          if-no-files-found: error

      - name: Upload verified APK package
        if: steps.defender.outputs.scan_status == 'clean'
        uses: actions/upload-artifact@v4
        with:
          name: invoice-studio-apk-verified
          path: candidate/
          if-no-files-found: error

      - name: Fail when scan is not clean
        if: steps.defender.outputs.scan_status != 'clean'
        shell: bash
        run: |
          echo "Defender scan status: ${{ steps.defender.outputs.scan_status }}"
          echo "APK is not published as verified when scan is unavailable or non-clean."
          exit 1
