name: Build APK

# Har push pe chalega, aur Actions tab se hath se bhi chala sakte ho
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Code lo
        uses: actions/checkout@v4

      - name: Node lagao
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java lagao
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Packages install karo
        run: npm install

      - name: Android project banao
        run: npx cap add android

      - name: Icon aur splash lagao
        run: npx @capacitor/assets generate --android || echo "assets skip"

      - name: Web files copy karo
        run: npx cap sync android

      - name: APK build karo
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: APK yahan rakh do
        uses: actions/upload-artifact@v4
        with:
          name: invoice-studio-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Tag push karo (jaise v1.0.0) to APK Releases page pe bhi chali jayegi
      - name: Release pe bhejo
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
